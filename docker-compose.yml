services:
  postgres:
    image: postgres:16-alpine
    container_name: learnova-postgres
    environment:
      POSTGRES_USER: learnova
      POSTGRES_PASSWORD: learnova_dev_pw
      POSTGRES_DB: learnova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnova -d learnova"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: learnova-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile.sandbox
    image: learnova-python-sandbox:latest
    command: ["sh", "-c", "echo sandbox image ready"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnova-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://learnova:learnova_dev_pw@postgres:5432/learnova
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SANDBOX_MODE: docker
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnova-celery
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://learnova:learnova_dev_pw@postgres:5432/learnova
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnova-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
